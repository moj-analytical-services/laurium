[project]
name = "laurium"
version = "0.6.0"
authors = [
  { name="Tom O'Connor", email="tom.oconnor@justice.gov.uk" },
  { name="William Martin", email="william.martin1@justice.gov.uk" },
  { name="Lisa Malki", email="lisa.Malki@justice.gov.uk" },
  { name="Daoud Chaudry", email="daoud.chaudry@justice.gov.uk" }
]
description = "A package for extracting structured data from free text"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "numpy>=2.0.0",
    "protobuf>=5.28.1",
    "pandas>=2.2.2",
    "boto3>=1.34.0",
    "faker>=37.3.0",
    "evaluate>=0.4.3",
    "langchain-core>=0.1.30",
    "langchain-community>=0.0.16",
    "langchain-aws>=0.2.7",
    "langchain-ollama>=0.0.2",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.0.4",
    "pydantic>=2.6.3",
    "spacy==3.8.16",
    "pydbtools>=5.8.1",
]

[project.optional-dependencies]
encoder = [
    "datasets>=3.6.0",
    "optuna>=4.5.0",
    "peft>=0.15.2",
    "pytorch-lightning==2.6.6",
    "scikit-learn>=1.8.0",
    "torch>=2.4.0",
    "transformers>5.10.0,<6",
    "setfit>=1.1.3",
]
notebooks = [
    "altair>=5.5.0",
    "marimo>=0.14.11",
]

[project.urls]
homepage = "https://github.com/moj-analytical-services/laurium"
repository = "https://github.com/moj-analytical-services/laurium"
documentation = "https://moj-analytical-services.github.io/laurium"

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "ipykernel>=6.29.5",
    "pandas-stubs>=2.2.2.240807",
    "pandasql>=0.7.3",
    "pre-commit>=3.5.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.2",
    "ruff>=0.6.3",
    "uv>=0.13.4",
    "virtualenv>=21.14.9",
]

docs = [
    "mkdocs-material>=9.6.15",
    "mkdocstrings[python]>=0.29.1",
    "mkdocs-api-autonav>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
skip_empty = true
show_missing = true
format = "markdown"
fail_under = 75
include = [
    "src/*",
]
exclude_also = [
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.uv]
exclude-newer = "PT72H"
constraint-dependencies = ["setuptools>=84.1.0", "tornado>=6.6"]

