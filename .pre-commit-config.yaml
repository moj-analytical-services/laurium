repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=5000"]
        description: do not upload files larger than 5000kb / 5MB to avoid data being uploaded
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces to replace line ending by the UNIX 'lf' character.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: ["--check"]
  - repo: https://github.com/kynan/nbstripout
    rev: f5da19ce3b7b40e97c12ee9cd8ce97f48f97ddf7  # frozen: 0.9.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: b9d5257d60a86c20fd9a3919d548e08ba5ab905b  # frozen: 0.13.8
    hooks:
      - id: uv-lock
  - repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99  # frozen: v1.10.1
    hooks:
      - id: betterleaks
